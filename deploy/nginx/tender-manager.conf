# nginx site for Tender Manager. Replace YOUR_DOMAIN everywhere (deploy/README.md, step 7):
#   sudo sed -i 's/YOUR_DOMAIN/yourdomain.com/g' /etc/nginx/sites-available/tender-manager.conf
#
# One site serves every client: <slug>.YOUR_DOMAIN, owner.YOUR_DOMAIN and YOUR_DOMAIN.
# The web app is static files; /api goes to the API on 127.0.0.1:4000.

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN *.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN *.YOUR_DOMAIN;

    # Wildcard certificate (covers YOUR_DOMAIN and *.YOUR_DOMAIN), from certbot.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Excel uploads and tender documents (the API checks its own limits too).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /opt/tender-manager/apps/web/dist;

    # The API. Host must be passed on: it tells the API which client this is.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files have a hash in their name, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Source maps stay on the server.
    location ~ \.map$ {
        return 404;
    }

    # Every other path is a page of the web app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
