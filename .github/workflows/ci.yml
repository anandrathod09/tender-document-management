name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: tender_saas_ci
      TEST_DB_NAME: tender_saas_test
      BASE_DOMAIN: localhost
      PUBLIC_URL_TEMPLATE: http://{slug}.localhost:5173
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      MAIL_FROM_ADDRESS: no-reply@example.com

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations match the schema
        run: |
          npm run db:generate -- --name ci-check
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::schema.ts changed without a migration. Run npm run db:generate and commit the result."
            git status --porcelain apps/api/drizzle
            exit 1
          fi
      - run: npm test
      - run: npm run build
